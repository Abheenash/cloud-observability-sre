name: ci
on: [push, pull_request]
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false
  runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SSM automation document is valid YAML with the required steps
        run: |
          python3 - <<'EOF'
          import yaml, sys
          d = yaml.safe_load(open("fis/throttle-lambda.yaml"))
          steps = {s["name"]: s for s in d["mainSteps"]}
          assert {"throttle", "hold", "restore"} <= steps.keys()
          # Every non-final step must fall through to restore on failure AND cancel.
          for n in ("throttle", "hold"):
              assert steps[n]["onFailure"] == "step:restore" and steps[n]["onCancel"] == "step:restore", n
          assert steps["restore"]["inputs"]["Api"] == "DeleteFunctionConcurrency"
          print("runbook ok")
          EOF
      - run: bash -n scripts/drill.sh

  # tflint catches what `terraform validate` cannot: unused declarations, missing
  # provider version constraints, invalid instance types. It found an unpinned
  # `archive` provider in two of these repos.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ github.workspace }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  # `terraform test` against a mocked provider: no cloud account, no cost. It
  # asserts the specific promises this repo's README makes — which a generic
  # scanner cannot know.
  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test
